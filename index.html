<!doctype html>

<head>
  <title>GoonGoonGoon.fun</title>
  <meta charset='UTF-8'>
    <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family:Arial, Helvetica, sans-serif;
      font-style: italic;
      font-weight: 1000;
      overflow: hidden;
      animation: zmianaKoloru 8s infinite;
    }

    @keyframes zmianaKoloru {
    0%   { background-color: #ff6b6b; }
    25%  { background-color: #feca57; }
    50%  { background-color: #48dbfb; }
    75%  { background-color: #1dd1a1; }
    100% { background-color: #ff6b6b; }
    }

    .hello-message {
      margin: 40px;
      text-align: center;
    }
    .logout-messages {
      pointer-events: none;
      color: red;
      margin: 40px;
      position: fixed;
      top: 0;
      left: 0;
      text-shadow: 2px 2px #FFF, 4px 4px 10px #000;
    }
    img {
      width: 600px;
    }
    @keyframes blurslowly {
      0% {
        filter: none;
      }
      92% {
        filter: blur(0);
      }
      96% {
        filter: blur(1px);
      }
      100% {
        filter: blur(0);
      }
    }
    body {
      animation-name: blurslowly;
      animation-iteration-count: infinite;
      animation-duration: 15s;
      animation-play-state: running;
    }
    .aura {
    animation: zmianaKoloru2 3s infinite;
    }

    @keyframes zmianaKoloru2 {
      0%   { color: yellow; }
      50%  { color: rgb(255, 0, 0); }
      100% { color: yellow; }
    } 

  </style>
  <link rel="icon" type="image/x-icon" href="media/images/logoggg.png">
