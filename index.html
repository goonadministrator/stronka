<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoonGoonGoon.fun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="logoggg.png" alt="Logo" class="Logo">
    <marquee class = "aura2" direction="left">WITAMY NA NASZEJ STRONIE!!!</marquee>

    

<h1 class="aura">EPSTEIN CLICKER!!!<div id="licznik">0 EPSTEINÓW</div></h1>

<img src="epstein.png" class="obrazek" onclick="zwieksz()">

<script>
let liczba = 0;

function zwieksz() {
    liczba++;
    document.getElementById("licznik").textContent = liczba + " EPSTEINÓW";
}
</script>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(45deg, red, yellow, lime, cyan, blue, magenta);
    background-size: 400% 400%;
    animation: bg 3s infinite linear;
    font-family: Comic Sans MS, cursive;
}

@keyframes bg {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

#start {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 40px;
    padding: 20px 40px;
    cursor: pointer;
}

.popup {
    position: fixed;
    background: yellow;
    border: 5px solid red;
    padding: 10px;
    font-size: 24px;
    font-weight: bold;
    z-index: 9999;
}

.flying {
    position: fixed;
    font-size: 50px;
    pointer-events: none;
}
</style>
</head>
<body>

<button id="start">spermaHAHAHAH</button>

<audio id="beep">
    <source src="https://www.soundjay.com/buttons/beep-07a.mp3" type="audio/mpeg">
</audio>

<script>
const btn = document.getElementById("start");
const beep = document.getElementById("beep");

function random(min, max) {
    return Math.random() * (max - min) + min;
}

btn.onclick = () => {

    btn.remove();

    document.title = "😂😂😂😂😂";

    setInterval(() => {
        document.body.style.transform =
            `rotate(${random(-3,3)}deg)`;
    }, 100);

    setInterval(() => {
        const p = document.createElement("div");
        p.className = "popup";
        p.innerHTML = "😂 HAHAHAHA 😂";

        p.style.left = random(0, window.innerWidth - 200) + "px";
        p.style.top = random(0, window.innerHeight - 100) + "px";

        document.body.appendChild(p);

        setTimeout(() => p.remove(), 5000);

        beep.currentTime = 0;
        beep.play().catch(() => {});
    }, 500);

    setInterval(() => {
        const e = document.createElement("div");
        e.className = "flying";
        e.innerHTML = ["🐦","😂","💥","🚀","🔥"][Math.floor(Math.random()*5)];

        let x = random(0, window.innerWidth);
        let y = random(0, window.innerHeight);

        e.style.left = x + "px";
        e.style.top = y + "px";

        document.body.appendChild(e);

        let dx = random(-10,10);
        let dy = random(-10,10);

        const move = setInterval(() => {
            x += dx;
            y += dy;

            e.style.left = x + "px";
            e.style.top = y + "px";

            if (
                x < -100 ||
                y < -100 ||
                x > window.innerWidth + 100 ||
                y > window.innerHeight + 100
            ) {
                clearInterval(move);
                e.remove();
            }
        }, 30);

    }, 150);

    setInterval(() => {
        document.body.style.background =
            `hsl(${Math.random()*360},100%,50%)`;
    }, 200);

    setInterval(() => {
        document.title =
            ["HAHAHAHA","😂😂😂","💥💥💥","🐦🐦🐦"][Math.floor(Math.random()*4)];
    }, 300);
};
</script>

</body>
</html>
